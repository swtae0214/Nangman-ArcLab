# 8주차: 자체 서버(Raspberry Pi / EC2) 배포용 구성.
# DB는 여기 포함하지 않는다 — NAS에서 별도 Postgres 컨테이너로 띄워 네트워크로 접속하는 구조라서다.
# 사용법:
#   1) .env.production (.env.production.example 참고)을 이 파일과 같은 위치에 만든다.
#   2) docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      COOKIE_SECRET: ${COOKIE_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      API_PORT: 4000
      # GitHub OAuth App(운영용으로 따로 등록한 것) — Authorization callback URL은
      # "${WEB_ORIGIN}/api/backend/auth/github/callback" 이어야 한다.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # 보통은 비워둔다(운영 환경이면 자동으로 HTTPS 전용 쿠키). 와이어가드 같은 이미 암호화된
      # 사설망 안에서만 쓰는 내부 테스트 배포라 도메인/HTTPS가 없다면 .env.production에서
      # COOKIE_SECURE=false 로 명시해야 로그인이 된다 — 공개 인터넷에는 절대 false로 두지 말 것.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # API_INTERNAL_URL은 여기서 안 넘긴다 — output:"standalone" 빌드라 next.config.ts의 rewrites가
    # 빌드 시점에 고정되기 때문에(apps/web/Dockerfile 참고), 런타임 environment로 줘도 무시된다.
    ports:
      - "3000:3000"
    depends_on:
      - api
