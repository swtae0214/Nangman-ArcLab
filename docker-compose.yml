services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archlab_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-archlab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - archlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archlab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  archlab_pgdata:
