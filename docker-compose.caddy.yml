# 외부 인터넷에 공개할 때만 docker-compose.prod.yml과 같이 쓰는 덧붙임 파일(override).
# Caddy가 80/443 포트를 받아서 web으로 중계하고, Let's Encrypt 인증서 발급·갱신을 전부 알아서 한다.
# 사용법:
#   docker compose -f docker-compose.prod.yml -f docker-compose.caddy.yml --env-file .env.production up -d --build
#
# 필요 조건:
#   - .env.production에 DOMAIN=실제도메인 을 채워뒀을 것
#   - 그 도메인의 DNS A 레코드가 이 서버의 공인 IP를 가리킬 것
#   - 서버 방화벽/공유기에서 80, 443 포트를 외부에 열어뒀을 것 (3000/4000은 막아도 된다 —
#     외부에선 Caddy를 거친 80/443으로만 들어오면 충분하다)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
